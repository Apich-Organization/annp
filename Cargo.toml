[workspace]
resolver = "2"
members = [
    "annp-core",
    "annp-cuda",
    "annp-model",
    "annp-trainer",
    "annp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Xinyu Yang <Xinyu.Yang@apich.org>"]
description = "The rust implementation of the Asynchronous Neuro Network Protocol."

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
half = "2.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
dtact = "0.2"
tokenizers = "0.23"
