[package]
name = "annp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["cuda"]
cuda = ["annp-model/cuda", "annp-cuda/cuda", "annp-trainer/cuda"]

[dependencies]
annp-core = { path = "../annp-core" }
annp-cuda = { path = "../annp-cuda", default-features = true, features = ["cuda"] }
annp-model = { path = "../annp-model" }
annp-trainer = { path = "../annp-trainer" }
candle-core.workspace = true
candle-nn.workspace = true
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rusqlite = { version = "0.34", features = ["bundled"] }
rand.workspace = true
log.workspace = true
env_logger = "0.11"
thiserror.workspace = true
dtact.workspace = true
tokenizers.workspace = true
sentencepiece = "0.14.0"
